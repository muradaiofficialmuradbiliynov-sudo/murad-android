<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MURAD-ANDROID UI</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #030008;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Ana Panel - Nexus/Delta Tarzı */
        .nexus-container {
            width: 92%;
            max-width: 380px;
            height: 82vh;
            background-color: rgba(10, 2, 20, 0.96);
            border: 2px solid #a100ff;
            border-radius: 12px;
            box-shadow: 0 0 35px rgba(161, 0, 255, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Üst Header */
        .header {
            background-color: #15002b;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #a100ff;
        }

        .logo {
            color: #fff;
            font-weight: bold;
            font-size: 1.1em;
            text-shadow: 0 0 10px #a100ff;
            letter-spacing: 1px;
        }

        .status {
            color: #00ff00;
            font-size: 0.7em;
            font-weight: bold;
            letter-spacing: 1px;
            background: rgba(0, 255, 0, 0.1);
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #00ff00;
        }

        /* Ana İçerik Alanı */
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sol Menü İkonları */
        .tabs {
            width: 55px;
            background-color: #06000f;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 15px;
            gap: 20px;
            border-right: 1px solid #1a0033;
        }

        .tab-icon {
            color: #a100ff;
            font-size: 1.3em;
            cursor: pointer;
            transition: 0.2s;
        }

        .tab-icon:hover, .tab-icon.active {
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
        }

        /* Sağ Kod Düzenleyici Bölgesi */
        .editor-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #010003;
            padding: 5px;
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8em;
            padding: 10px;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        /* Alt Konsol Çıktısı */
        .console {
            height: 65px;
            background-color: #06000f;
            border-top: 1px solid #1a0033;
            padding: 6px 10px;
            font-size: 0.7em;
            color: #88ffcc;
            overflow-y: auto;
            text-align: left;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Buton Grubu */
        .btn-group {
            padding: 10px;
            display: flex;
            gap: 8px;
            background-color: #15002b;
            border-top: 1px solid #a100ff;
        }

        .exec-btn {
            flex: 1;
            background: #a100ff;
            color: white;
            border: none;
            padding: 10px;
            font-size: 0.8em;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(161, 0, 255, 0.6);
            transition: 0.2s;
        }

        .exec-btn:active {
            transform: scale(0.96);
        }

        .clear-btn {
            background: #2b001a;
            color: #ff007f;
            border: 1px solid #ff007f;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.4);
        }
    </style>
</head>
<body>

<div class="nexus-container">
    <div class="header">
        <span class="logo">MURAD-ANDROID</span>
        <span class="status">INJECTED</span>
    </div>

    <div class="main-content">
        <!-- Sol Sekmeler -->
        <div class="tabs">
            <div class="tab-icon active" title="Dashboard">🏠</div>
            <div class="tab-icon" title="Executor">💻</div>
            <div class="tab-icon" title="Script Hub">🌐</div>
            <div class="tab-icon" title="Settings">⚙️</div>
        </div>

        <!-- Sağ Alan -->
        <div class="editor-zone">
            <textarea id="luaInput" placeholder="-- MURAD-ANDROID v1.0\n-- Paste your script or load from hub..."></textarea>
            
            <div class="console" id="consoleOutput">
                > MURAD-ANDROID initialized successfully.<br>
                > Mobile hook active. Ready to execute.<br>
            </div>
        </div>
    </div>

    <!-- Kontrol Butonları -->
    <div class="btn-group">
        <button class="exec-btn" onclick="executeScript()">Execute</button>
        <button class="exec-btn clear-btn" onclick="clearEditor()">Clear</button>
    </div>
</div>

<script>
    const consoleOutput = document.getElementById('consoleOutput');
    const luaInput = document.getElementById('luaInput');

    function log(text) {
        consoleOutput.innerHTML += `> ${text}<br>`;
        consoleOutput.scrollTop = consoleOutput.scrollHeight;
    }

    function clearEditor() {
        luaInput.value = "";
        log("Editor cleared.");
    }

    function executeScript() {
        const code = luaInput.value.trim();
        if(!code) {
            log("ERROR: No payload detected!");
            return;
        }
        log("Injecting payload...");
        
        setTimeout(() => { log("Bypassing client security checks..."); }, 400);
        setTimeout(() => { log("SUCCESS: Script executed via MURAD-ANDROID."); }, 1000);
    }
</script>

</body>
</html>
